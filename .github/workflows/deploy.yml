name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web
        # La web vive en la carpeta sitio/. Si no existe, se usa el .zip antiguo.
        run: |
          if [ -d sitio ]; then cp -r sitio _site; else mkdir _site && unzip -q sitio-deploy.zip -d _site; fi
      - name: Versionar CSS y JS
        # Cada publicación cambia el ?v= de estilos y scripts para que ningún
        # navegador se quede con una versión vieja guardada.
        run: |
          V="${GITHUB_SHA::10}"
          find _site -name '*.html' -exec sed -i -E "s/(styles\.css|main\.js|motion\.js)\?v=[A-Za-z0-9]+/\1?v=${V}/g" {} +
          grep -rho 'styles\.css?v=[A-Za-z0-9]*' _site | sort | uniq -c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
